<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#da2128">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Catene NPK">
<link rel="apple-touch-icon" href="icona.png">
<link rel="manifest" href="manifest.json">
<title>Catene da neve NPK</title>
<style>
:root{--red:#da2128;--ink:#14161a;--mute:#5d626b;--card:#f3f4f6;--line:#e2e4e8;--verde:#25d366;--ok:#14833b;
  --titolo:"DIN Condensed","Avenir Next Condensed","Arial Narrow",system-ui,sans-serif;
  --testo:"Avenir Next",-apple-system,system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#fff;color:var(--ink);font-family:var(--testo);font-size:16px;line-height:1.4}
body{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
[hidden]{display:none!important}
header{background:var(--red);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 16px 14px}
header div{max-width:540px;margin:0 auto}
h1{font-family:var(--titolo);font-size:36px;line-height:1;margin:0;text-transform:uppercase;letter-spacing:.5px}
header p{margin:3px 0 0;font-size:14px;opacity:.92}
main{max-width:540px;margin:0 auto;padding:16px}
.card{background:var(--card);border-radius:16px;padding:14px}
label.f{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px;text-transform:uppercase;letter-spacing:1px}
label.f:first-child{margin-top:0}
select,input[type=password]{width:100%;font:inherit;font-size:17px;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:12px;padding:13px 12px}
select{-webkit-appearance:none;appearance:none;padding-right:30px;
  background-image:linear-gradient(45deg,transparent 50%,var(--red) 50%),linear-gradient(135deg,var(--red) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 10px) 50%;background-size:6px 6px;background-repeat:no-repeat}
select:disabled{opacity:.45}
.riga{display:grid;grid-template-columns:1fr auto;gap:8px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:13px;background:var(--ink);color:#fff;padding:13px 16px;text-decoration:none;text-align:center}
.ricorda{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:15px}
#msg{min-height:22px;margin:10px 0 0;font-size:14px;color:var(--red)}
#esito{margin-top:14px}
.verdetto{border-radius:16px;padding:14px;color:#fff;background:var(--mute)}
.verdetto.ok{background:var(--ok)}
.verdetto.no{background:var(--red)}
.verdetto b{display:block;font-family:var(--titolo);font-size:30px;line-height:1;text-transform:uppercase;padding-top:3px}
.verdetto span{display:block;font-size:14px;margin-top:5px}
.manuale{margin-top:8px;background:#fff4d6;border-radius:12px;padding:10px 12px;font-size:14px}
.prop{display:grid;gap:8px;margin-top:10px}
.prop input{position:absolute;opacity:0}
.prop label{display:grid;grid-template-columns:70px 1fr auto;gap:10px;align-items:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.prop input:checked+label{border-color:var(--red);background:#fff7f7}
.prop input:focus-visible+label{outline:2px solid var(--ink);outline-offset:1px}
.mm{font-family:var(--titolo);font-size:32px;line-height:1;color:var(--red);padding-top:3px;white-space:nowrap}
.mm small{font-size:17px}
.tx{font-size:13px;color:var(--mute);line-height:1.3;min-width:0}
.tx b{display:block;color:var(--ink);font-size:15px}
.tx em{display:block;font-style:normal;font-weight:700;color:var(--red)}
.prezzo{text-align:right;font-size:12px;color:var(--mute);line-height:1.2}
.prezzo b{display:block;font-family:var(--titolo);font-size:25px;line-height:1;color:var(--ink);padding-top:2px}
.azioni{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.azioni .btn,.azioni button{background:var(--card);color:var(--ink);font-size:15px;padding:13px 8px}
.azioni .scuro{background:var(--ink);color:#fff}
.azioni .largo{grid-column:1/-1}
.nota{font-size:13px;color:var(--mute);margin:10px 2px 0}
footer{max-width:540px;margin:0 auto;padding:8px 16px 18px;color:var(--mute);font-size:12px;text-align:center}
.cta{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.96) 30%)}
.cta a{display:block;max-width:508px;margin:0 auto;background:var(--verde);color:#062e16;text-decoration:none;font-weight:800;font-size:18px;text-align:center;border-radius:16px;padding:16px}
</style>
</head>
<body>
<header><div><h1>Catene da neve NPK</h1><p>Vettura, misura, catena giusta</p></div></header>
<main>
  <section id="gate" class="card">
    <label class="f" for="pin">PIN</label>
    <div class="riga">
      <input type="password" id="pin" inputmode="numeric" autocomplete="off">
      <button type="button" id="sblocca">Sblocca</button>
    </div>
    <label class="ricorda"><input type="checkbox" id="ricorda"> Ricorda su questo dispositivo</label>
    <p id="msg" role="alert"></p>
  </section>
  <section id="app" hidden>
    <div class="card">
      <label class="f" for="marca">Marca</label>
      <select id="marca"></select>
      <label class="f" for="vettura">Vettura</label>
      <select id="vettura" disabled></select>
      <label class="f" for="misura">Misura pneumatico</label>
      <select id="misura" disabled></select>
    </div>
    <div id="esito" aria-live="polite"></div>
  </section>
</main>
<footer id="piede" hidden></footer>
<div class="cta" id="cta" hidden><a id="wa" href="#" target="_blank" rel="noopener">Manda al cliente su WhatsApp</a></div>

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
  function eur(n){ return n.toLocaleString("it-IT", {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function byte(b){ var s = atob(b), o = new Uint8Array(s.length); for(var i=0;i<s.length;i++) o[i] = s.charCodeAt(i); return o; }

  function decifra(pin){
    if(!(window.crypto && crypto.subtle)) return Promise.reject(new Error("nocrypto"));
    var p = DATA_BLOB.split("."), salt = byte(p[0]), iv = byte(p[1]), ct = byte(p[2]);
    return crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"])
      .then(function(k){ return crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:ITERAZIONI, hash:"SHA-256"}, k, {name:"AES-GCM", length:256}, false, ["decrypt"]); })
      .then(function(k){ return crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, k, ct); })
      .then(function(b){ return JSON.parse(new TextDecoder().decode(b)); });
  }
  function prova(pin, salvato){
    $("msg").textContent = "Sblocco…";
    decifra(pin).then(function(dati){
      if($("ricorda").checked || salvato){ try { localStorage.setItem(LS, pin); } catch(e){} }
      entra(dati);
    }).catch(function(e){
      if(e && e.message === "nocrypto"){ $("msg").textContent = "Apri la pagina da https: la decifratura richiede una connessione sicura."; return; }
      if(salvato){ try { localStorage.removeItem(LS); } catch(e2){} }
      $("msg").textContent = salvato ? "" : "PIN errato.";
    });
  }
  $("sblocca").addEventListener("click", function(){ var p = $("pin").value.trim(); if(p) prova(p, false); });
  $("pin").addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); $("sblocca").click(); } });

  function opzioni(sel, voci, vuoto){
    sel.innerHTML = '<option value="">' + esc(vuoto) + '</option>' + voci.map(function(v){ return '<option value="' + esc(v[0]) + '">' + esc(v[1]) + '</option>'; }).join("");
    sel.disabled = !voci.length;
  }
  function pulisci(){ attuale = null; $("esito").innerHTML = ""; $("cta").hidden = true; }

  function entra(dati){
    D = dati;
    $("gate").hidden = true; $("app").hidden = false; $("piede").hidden = false;
    $("piede").textContent = "Uso interno. Limiti letti il " + D.meta.generato.split("-").reverse().join("/") + " · prezzi IVA esclusa.";
    var marche = [], visti = {};
    D.veicoli.forEach(function(v){ if(!visti[v[0]]){ visti[v[0]] = 1; marche.push([v[0], v[0]]); } });
    opzioni($("marca"), marche, "Scegli la marca");
    opzioni($("vettura"), [], "Prima la marca");
    opzioni($("misura"), [], "Prima la vettura");
  }
  $("marca").addEventListener("change", function(){
    var m = this.value, voci = [];
    D.veicoli.forEach(function(v, i){ if(v[0] === m) voci.push([i, v[1] + (v[2] ? " (" + v[2] + ")" : "")]); });
    opzioni($("vettura"), voci, m ? "Scegli la vettura" : "Prima la marca");
    opzioni($("misura"), [], "Prima la vettura");
    pulisci();
  });
  $("vettura").addEventListener("change", function(){
    var v = D.veicoli[this.value];
    opzioni($("misura"), v ? v[3].map(function(x, i){ return [i, x[0]]; }) : [], v ? "Scegli la misura" : "Prima la vettura");
    pulisci();
    if(v && v[3].length === 1){ $("misura").value = "0"; mostra(); }
  });
  $("misura").addEventListener("change", mostra);

  function gruppo(c){ return c.slice(-3); }
  function nome(a){ return a.v === "TR" ? "Lappon TR 16 mm" : "Lappon " + a.mm + " mm"; }
  function testo(v, x, p){
    var a = D.articoli[p[0]];
    return "Ciao, per " + v[0] + " " + v[1] + (v[2] ? " (" + v[2] + ")" : "") + " con misura " + x[0] + ":\n" +
      "Catena NPK " + nome(a) + ", gruppo " + gruppo(p[0]) + "\nCodice " + p[0] + "\n" + eur(a.n) + " € netti + IVA\n" +
      (p[1] ? "Solo con ruote fino a " + p[1] + "J\n" : "") +
      "Prima dell'uso controlla libretto e manuale d'uso e fai una prova di montaggio.";
  }
  var TITOLI = {ok:"Catenabile", vietata:"Catene vietate", solo_esterna:"Solo catena esterna", nessuna_npk:"Nessuna NPK adatta", non_presente:"Esito sconosciuto", dati_incerti:"Dati incerti", misura_npk_assente:"Misura non in tabella"};

  function mostra(){
    var v = D.veicoli[$("vettura").value], i = $("misura").value;
    if(!v || i === ""){ pulisci(); return; }
    var x = v[3][i], stato = D.stati[x[1]], link = D.meta.url + "?c=" + x[4];
    var classe = stato === "ok" ? "ok" : (stato === "vietata" || stato === "solo_esterna" ? "no" : "");
    var h = '<div class="verdetto ' + classe + '"><b>' + TITOLI[stato] + '</b><span>' + esc(D.messaggi[stato]) +
      (x[2] ? " Maglia massima " + x[2] + " mm." : "") + '</span></div>';
    if(x[3]) h += '<div class="manuale">La fonte raccomanda un controllo manuale su questa combinazione.</div>';
    if(stato === "ok"){
      h += '<div class="prop" role="radiogroup" aria-label="Catena NPK">' + x[5].map(function(p, n){
        var a = D.articoli[p[0]];
        return '<input type="radio" name="cat" id="c' + n + '" value="' + n + '"' + (n ? '' : ' checked') + '>' +
          '<label for="c' + n + '"><span class="mm">' + a.mm + '<small> mm</small></span><span class="tx"><b>' + esc(nome(a)) + ' · gr. ' + gruppo(p[0]) + '</b>' +
          esc(p[0]) + (p[1] ? '<em>Solo ruote fino a ' + p[1] + 'J</em>' : '') + '</span><span class="prezzo">netto<b>' + eur(a.n) + ' €</b>listino ' + eur(a.l) + '</span></label>';
      }).join("") + '</div><div class="azioni"><button type="button" id="copia" class="scuro">Copia codice</button>' +
        '<a class="btn" href="https://b2bshop.makwheels.it/" target="_blank" rel="noopener">Giacenza su B2B</a>' +
        '<a class="btn largo" href="' + esc(link) + '" target="_blank" rel="noopener">Verifica alla fonte</a></div>';
    } else {
      h += '<div class="azioni"><a class="btn largo" href="' + esc(link) + '" target="_blank" rel="noopener">Verifica alla fonte</a></div>';
      if(stato === "vietata") h += '<p class="nota">La pagina della fonte può non mostrare il divieto del costruttore: il dato arriva dalla sua scheda vettura.</p>';
    }
    h += '<p class="nota">' + esc(D.avvertenza) + '</p>';
    $("esito").innerHTML = h;
    attuale = stato === "ok" ? {v:v, x:x} : null;
    $("cta").hidden = !attuale;
    if(attuale){
      aggiornaWa();
      Array.prototype.forEach.call(document.querySelectorAll('input[name="cat"]'), function(r){ r.addEventListener("change", aggiornaWa); });
      $("copia").addEventListener("click", copia);
    }
  }
  function scelta(){ var r = document.querySelector('input[name="cat"]:checked'); return attuale.x[5][r ? +r.value : 0]; }
  function aggiornaWa(){ $("wa").href = "https://wa.me/?text=" + encodeURIComponent(testo(attuale.v, attuale.x, scelta())); }
  function copia(){
    var c = scelta()[0], b = $("copia");
    function fatto(){ b.textContent = "Copiato"; setTimeout(function(){ b.textContent = "Copia codice"; }, 1500); }
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(c).then(fatto).catch(function(){ b.textContent = c; }); }
    else { b.textContent = c; }
  }

  var s = null;
  try { s = localStorage.getItem(LS); } catch(e){}
  if(s) prova(s, true);
});
</script>
</body>
</html>
